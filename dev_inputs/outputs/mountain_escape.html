<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mountain Escape — Procedural 1080p Canvas Short</title>
  <meta name="description" content="A twenty-second, code-rendered 1080p animation of a runner escaping a pack of animals and leaping to a mountain summit.">
  <style>
    :root { color-scheme: dark; --bg:#070a0d; --panel:#121820; --line:#303944; --text:#f6f2e8; --muted:#9ca8b4; --hot:#f6a847; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
    body { display:grid; place-items:center; }
    main { width:min(100% - 24px, 1500px); padding:24px 0 32px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:12px; }
    h1 { margin:0; font-size:clamp(20px,3vw,32px); letter-spacing:-.03em; }
    header p { margin:4px 0 0; color:var(--muted); }
    .spec { flex:none; border:1px solid var(--line); border-radius:999px; padding:7px 11px; color:#8bd6ee; font-size:12px; font-weight:800; }
    .viewport { width:100%; aspect-ratio:16/9; overflow:hidden; border:1px solid var(--line); border-radius:10px; background:#000; box-shadow:0 28px 90px #0009; }
    canvas { display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
    .controls { display:grid; grid-template-columns:auto auto minmax(140px,1fr) auto auto auto; align-items:center; gap:8px; padding:10px; margin-top:12px; border:1px solid var(--line); border-radius:9px; background:var(--panel); }
    button { min-height:42px; border:1px solid var(--line); border-radius:6px; padding:8px 13px; background:#202934; color:var(--text); font:inherit; cursor:pointer; }
    button:hover { background:#2b3744; }
    button.primary { background:#c96c22; border-color:#ec9446; }
    button:focus-visible,input:focus-visible { outline:3px solid var(--hot); outline-offset:3px; }
    button[aria-pressed="true"] { color:#8bd6ee; border-color:#528fa3; }
    button:disabled { opacity:.6; cursor:wait; }
    input { width:100%; accent-color:var(--hot); }
    output { min-width:106px; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums; }
    .help { margin:9px 2px 0; color:var(--muted); font-size:12px; }
    @media(max-width:800px){ header{align-items:start;flex-direction:column}.controls{grid-template-columns:repeat(3,1fr)}.controls input{grid-column:1/-1;grid-row:1}.controls output{grid-column:1/-1} }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Mountain Escape</h1><p>A twenty-second procedural pixel-canvas short.</p></div>
      <div class="spec">1920 × 1080 · 30 FPS · 600 FRAMES</div>
    </header>
    <div class="viewport">
      <canvas id="screen" width="1920" height="1080" aria-label="A stick figure escapes a pack of wolves, reaches a mountain, and jumps to its summit"></canvas>
    </div>
    <img src="https://messages-prod.27c852f3500f38c1e7786e2c9ff9e48f.r2.cloudflarestorage.com/019fb5d7-2ca5-7f31-a2e0-1d91ff61bde7/1785813121663-019fcac0-3802-76cc-8328-fd0b1463fe92.jpeg?X-Amz-Algorithm=AWS4-HMAC-SHA256&amp;X-Amz-Content-Sha256=UNSIGNED-PAYLOAD&amp;X-Amz-Credential=b33de61d4f22a31b59b25364ab5037c5%2F20260804%2Fauto%2Fs3%2Faws4_request&amp;X-Amz-Date=20260804T032129Z&amp;X-Amz-Expires=3600&amp;X-Amz-Signature=e35e2fa1871fa395de2480d4e6e4162151880adb3bf970f995338491e3b9876d&amp;X-Amz-SignedHeaders=host&amp;x-amz-checksum-mode=ENABLED&amp;x-id=GetObject" alt="019fb5d7-2ca5-7f31-a2e0-1d91ff61bde7/1785813121663-019fcac0-3802-76cc-8328-fd0b1463fe92.jpeg"/>
    <div class="controls" aria-label="Animation controls">
      <button class="primary" id="play" type="button">Pause</button>
      <button id="restart" type="button">Restart</button>
      <input id="scrub" type="range" min="0" max="600" value="0" aria-label="Animation timeline">
      <output id="clock" for="scrub">0:00 / 0:20</output>
      <button id="loop" type="button" aria-pressed="true">Loop: on</button>
      <button id="record" type="button">Record WebM</button>
    </div>
    <p class="help">The canvas always contains the full 2,073,600 pixels of a 1080p frame. CSS only scales that finished frame to fit your viewport.</p>
  </main>

  <script>
  (() => {
    'use strict';
    const W=1920,H=1080,FPS=30,LENGTH=20,FRAMES=600;
    const canvas=document.querySelector('#screen');
    const g=canvas.getContext('2d',{alpha:false,desynchronized:true});
    const play=document.querySelector('#play'),restart=document.querySelector('#restart');
    const scrub=document.querySelector('#scrub'),clock=document.querySelector('#clock');
    const loop=document.querySelector('#loop'),record=document.querySelector('#record');
    g.imageSmoothingEnabled=false;
    let running=true,looping=true,time=0,anchor=performance.now(),anchorTime=0,last=-1,recording=false;
    const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
    const lerp=(a,b,t)=>a+(b-a)*t;
    const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
    const phase=(t,a,b)=>clamp((t-a)/(b-a));
    const hash=n=>{const x=Math.sin(n*91.731)*43758.5453;return x-Math.floor(x)};
    const px=v=>Math.round(v);

    function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(px(x),px(y),px(w),px(h));}
    function line(x1,y1,x2,y2,width,color){g.strokeStyle=color;g.lineWidth=width;g.lineCap='square';g.beginPath();g.moveTo(px(x1),px(y1));g.lineTo(px(x2),px(y2));g.stroke();}
    function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(px(x),px(y),px(r),0,Math.PI*2);g.fill();}
    function poly(points,color){g.fillStyle=color;g.beginPath();g.moveTo(px(points[0][0]),px(points[0][1]));for(let i=1;i<points.length;i++)g.lineTo(px(points[i][0]),px(points[i][1]));g.closePath();g.fill();}

    function camera(t){
      if(t<12) return {x:t*118,y:0,zoom:1};
      const p=smooth(phase(t,12,17.7));
      return {x:lerp(1416,2440,p),y:lerp(0,-100,p),zoom:lerp(1,1.07,p)};
    }

    function sky(t){
      const dusk=smooth(phase(t,7,18));
      const grad=g.createLinearGradient(0,0,0,H);
      grad.addColorStop(0,`rgb(${px(lerp(17,8,dusk))},${px(lerp(48,18,dusk))},${px(lerp(70,37,dusk))})`);
      grad.addColorStop(.62,`rgb(${px(lerp(88,40,dusk))},${px(lerp(123,53,dusk))},${px(lerp(130,66,dusk))})`);
      grad.addColorStop(1,`rgb(${px(lerp(236,117,dusk))},${px(lerp(151,73,dusk))},${px(lerp(88,63,dusk))})`);
      g.fillStyle=grad;g.fillRect(0,0,W,H);
      circle(1520,180,74,`rgba(255,224,157,${1-dusk*.55})`);
      for(let i=0;i<90;i++){const x=hash(i)*W,y=hash(i+500)*520,a=clamp((dusk-.35)*2)*hash(i+80);rect(x,y,2+(i%3),2+(i%3),`rgba(245,245,220,${a})`)}
    }

    function world(t,cam){
      g.save();
      g.translate(W/2,H/2);g.scale(cam.zoom,cam.zoom);g.translate(-W/2-cam.x,-H/2-cam.y);
      // distant ranges
      poly([[-400,760],[100,410],[450,690],[820,340],[1200,720],[1600,380],[2050,740],[2450,300],[3050,770],[3500,1080],[-400,1080]],'#263c46');
      poly([[-400,820],[200,590],[580,750],[980,540],[1420,810],[1840,570],[2200,810],[2780,500],[3400,860],[3500,1080],[-400,1080]],'#172b31');
      // the tall mountain and snow cap
      poly([[2140,940],[2590,140],[3060,940]],'#23333a');
      poly([[2590,140],[2425,435],[2525,398],[2590,472],[2670,390],[2760,450]],'#e1e7e5');
      poly([[2140,940],[2590,140],[2470,705],[2370,805]],'#2f454c');
      // near ground
      poly([[-500,810],[250,785],[720,820],[1180,775],[1680,825],[2110,790],[2260,940],[3200,940],[3500,1080],[-500,1080]],'#101d1c');
      rect(-500,840,2700,240,'#17241f');
      for(let i=-5;i<45;i++){
        const x=i*110+(hash(i+99)*50),h=55+hash(i+9)*90;
        rect(x,840-h,12,h,'#0b1715');
        poly([[x-42,840-h+40],[x+6,840-h-50],[x+52,840-h+40]],'#0b1715');
      }
      drawDust(t,cam);
      drawPack(t);
      drawRunner(t);
      g.restore();
    }

    function runnerPosition(t){
      if(t<12.25) return {x:580+t*125,y:775};
      if(t<13.25){const p=smooth(phase(t,12.25,13.25));return{x:2111+180*p,y:775+145*p};}
      if(t<17.3){const p=phase(t,13.25,17.3),arc=Math.sin(p*Math.PI);return{x:2291+299*p,y:920-735*arc};}
      const p=phase(t,17.3,18.15),arc=Math.sin(p*Math.PI);return{x:2590+120*p,y:185-105*arc};
    }

    function drawRunner(t){
      const p=runnerPosition(t), airborne=t>=13.25;
      const cycle=t*9*Math.PI, stride=airborne?0:Math.sin(cycle)*46;
      const lean=t>12.2?-.22:.12, bob=airborne?0:Math.abs(Math.sin(cycle))*10;
      const x=p.x,y=p.y-bob;
      g.save();g.translate(px(x),px(y));g.rotate(lean);
      const body='#f5efe3',shadow='#8bd6ee',accent='#f6a847';
      circle(0,-150,27,body); circle(8,-157,4,'#101820');
      line(-1,-120,2,-43,17,body);
      line(1,-105,-50,-65-stride*.35,14,shadow);line(-50,-65-stride*.35,-75,-30-stride*.15,13,shadow);
      line(2,-101,48,-70+stride*.35,14,body);line(48,-70+stride*.35,74,-40+stride*.15,13,body);
      line(1,-43,-40+stride,-2,17,body);line(-40+stride,-2,-61+stride,35,15,body);
      line(1,-43,40-stride,-3,17,shadow);line(40-stride,-3,62-stride,34,15,shadow);
      rect(-28,-122,10,62,accent);
      g.restore();
    }

    function animalPosition(t,index){
      const spacing=index*105;
      let x=230+t*(119-index*1.8)-spacing;
      if(t>12.2)x=1680+t*46-spacing;
      return{x,y:815+index%2*8};
    }

    function drawWolf(t,index){
      const p=animalPosition(t,index),cycle=t*(8.3-index*.2)*Math.PI+index;
      const leap=Math.abs(Math.sin(cycle))*18,leg=Math.sin(cycle)*34,s=1-index*.035;
      g.save();g.translate(px(p.x),px(p.y-leap));g.scale(s,s);
      const fur=['#75818a','#5f7079','#839097','#52646e'][index%4],dark='#26363d';
      // tail, body, neck, head, ears and muzzle
      line(-72,-55,-125,-90+Math.sin(cycle)*18,20,fur);
      poly([[-78,-79],[32,-88],[65,-50],[31,-25],[-76,-32]],fur);
      poly([[25,-79],[65,-116],[95,-73],[64,-39]],fur);
      poly([[62,-123],[76,-163],[88,-118],[103,-152],[108,-102]],dark);
      poly([[62,-119],[108,-108],[129,-84],[92,-72]],fur);
      circle(104,-105,4,'#f6a847');
      line(-49,-34,-63+leg,18,15,dark);line(-4,-30,17-leg,18,15,dark);
      line(28,-32,49+leg,18,14,dark);line(51,-42,67-leg,14,14,dark);
      g.restore();
    }

    function drawPack(t){
      const fade=1-smooth(phase(t,14,16));g.save();g.globalAlpha=fade;
      for(let i=5;i>=0;i--)drawWolf(t,i);
      g.restore();
    }

    function drawDust(t){
      for(let i=0;i<26;i++){
        const age=(t*2.3+i*.47)%3.3,x=500+t*121-i*58-age*46,y=840-age*21+hash(i)*20;
        circle(x,y,5+age*8,`rgba(201,173,118,${clamp(.35-age*.1)})`);
      }
    }

    function foreground(t){
      const speed=t*150;
      g.save();g.globalAlpha=.65;
      for(let i=0;i<22;i++){
        const x=((i*173-speed*1.6)%(W+300)+W+300)%(W+300)-150;
        const h=70+hash(i)*160;
        line(x,H,x+15,H-h,12,'#07100e');
        line(x+15,H-h,x-25,H-h-50,8,'#07100e');
      }
      g.restore();
    }

    function overlays(t){
      const intro=1-smooth(phase(t,1.3,2.1));
      g.save();g.globalAlpha=intro;g.textAlign='center';g.fillStyle='#f6f2e8';g.font='800 88px Inter,system-ui';g.fillText('RUN.',W/2,210);g.font='600 25px Inter,system-ui';g.fillStyle='#a9cbd5';g.fillText('THE MOUNTAIN IS THE ONLY WAY OUT',W/2,265);g.restore();
      const summit=smooth(phase(t,17.5,18.3))*(1-smooth(phase(t,19.3,20)));
      g.save();g.globalAlpha=summit;g.textAlign='center';g.fillStyle='#f6f2e8';g.font='800 82px Inter,system-ui';g.fillText('LEAP BEYOND THE LIMIT.',W/2,195);g.font='600 28px Inter,system-ui';g.fillStyle='#f6a847';g.fillText('MOUNTAIN ESCAPE',W/2,247);g.restore();
      rect(70,H-64,(W-140)*clamp(t/LENGTH),5,'#f6a847');
      g.fillStyle='#dce8e8';g.font='600 18px ui-monospace,monospace';g.textAlign='left';g.fillText(`${String(Math.floor(t*FPS)).padStart(3,'0')} / 600`,70,H-28);
    }

    function render(t){
      sky(t);const cam=camera(t);world(t,cam);foreground(t);overlays(t);
    }

    function sync(){scrub.value=Math.round(time*FPS);clock.value=`0:${String(Math.floor(time)).padStart(2,'0')} / 0:20`;play.textContent=running?'Pause':'Play';}
    function seek(v){time=clamp(v,0,LENGTH);anchorTime=time;anchor=performance.now();last=-1;render(time);sync();}
    function tick(now){
      if(running){
        time=anchorTime+(now-anchor)/1000;
        if(time>=LENGTH){if(looping||recording){time%=LENGTH;anchorTime=time;anchor=now}else{time=LENGTH;running=false}}
        const frame=Math.min(FRAMES,Math.floor(time*FPS));
        if(frame!==last){render(frame/FPS);last=frame;sync()}
      }
      requestAnimationFrame(tick);
    }
    play.addEventListener('click',()=>{if(time>=LENGTH)seek(0);running=!running;anchorTime=time;anchor=performance.now();sync()});
    restart.addEventListener('click',()=>{running=true;seek(0)});
    scrub.addEventListener('input',()=>seek(Number(scrub.value)/FPS));
    loop.addEventListener('click',()=>{looping=!looping;loop.setAttribute('aria-pressed',String(looping));loop.textContent=`Loop: ${looping?'on':'off'}`});
    record.addEventListener('click',()=>{
      if(recording)return;
      if(!canvas.captureStream||typeof MediaRecorder==='undefined'){alert('Canvas recording is unavailable in this browser.');return}
      const options=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
      const type=options.find(x=>MediaRecorder.isTypeSupported(x))||'';
      const recorder=new MediaRecorder(canvas.captureStream(FPS),type?{mimeType:type,videoBitsPerSecond:14_000_000}:undefined),chunks=[];
      recording=true;record.disabled=true;record.textContent='Recording 20s…';running=true;looping=false;seek(0);
      recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mountain-escape-1080p-30fps.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);recording=false;record.disabled=false;record.textContent='Record WebM';looping=true;loop.setAttribute('aria-pressed','true');loop.textContent='Loop: on'};
      recorder.start();setTimeout(()=>recorder.stop(),LENGTH*1000+150);
    });
    render(0);sync();requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
