# Fast regression profile for the domain adapters that use custom images.
output_root: ./output

modules:
  maigret: false
  blackbird: false
  social_analyzer: false
  amass: false
  spiderfoot: true
  recon_ng: true
  exiftool: false
  yente: false
  trufflehog: false
  theharvester: false

default_execution: auto
execution:
  spiderfoot: docker
  recon_ng: docker

docker_images:
  spiderfoot: reputation-audit-framework-spiderfoot:4.0
  recon_ng: reputation-audit-framework-recon-ng:5.1.2

timeouts:
  spiderfoot: 120
  recon_ng: 300

module_options:
  spiderfoot:
    modules: [sfp_dnsresolve]
  recon_ng:
    modules: [recon/domains-hosts/certificate_transparency]

integrations:
  search_by_image: {enabled: false}
  linkscope: {enabled: false}
  openaleph: {enabled: false}

risk_thresholds: {high: 8, elevated: 5, moderate: 3}
risk_weights:
  impersonation_keyword: 2
  gps_metadata: 3
  subdomain_exposure: 2
  secret_exposure: 4
  pii_metadata: 1
risk_rules:
  subdomain_exposure_threshold: 10
  max_impersonation_points: 6
  impersonation_keywords: [official, real, support, admin, verified]
reporting:
  markdown: true
  pdf: false
  company: "Authentic Dynamics"
  analyst: "Andrew Guasch"
logging:
  level: INFO
  file: audit.log
  json_lines: true
