# Minimal native profile for username-only audits and installation verification.
# Install the current Python-3.12-compatible collector with:
#   python -m pip install "maigret>=0.6.3,<0.7"

output_root: ./output

modules:
  maigret: true
  blackbird: false
  amass: false
  spiderfoot: false
  exiftool: false
  trufflehog: false
  theharvester: false

default_execution: native
execution:
  maigret: native

timeouts:
  maigret: 300

module_options:
  maigret:
    top_sites: 20
    request_timeout: 10
    tags: []

risk_thresholds:
  high: 8
  elevated: 5
  moderate: 3

risk_weights:
  impersonation_keyword: 2
  gps_metadata: 3
  subdomain_exposure: 2
  secret_exposure: 4
  pii_metadata: 1

risk_rules:
  subdomain_exposure_threshold: 10
  max_impersonation_points: 6
  impersonation_keywords:
    - official
    - real
    - realtor
    - realty
    - homes
    - properties
    - agent
    - broker
    - team
    - group
    - support
    - admin
    - help
    - verified
    - backup
    - hq

reporting:
  markdown: true
  pdf: false
  company: "Your Security Practice, LLC"
  analyst: "Unassigned"

logging:
  level: INFO
  file: audit.log
  json_lines: true
