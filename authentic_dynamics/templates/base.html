<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Authentic Dynamics | Your Central PA Digital Partner{% endblock %}</title>
  <meta name="description" content="{% block description %}Websites, local search, marketing and practical technology for Central Pennsylvania businesses. Founder-led. Community-rooted. We build. You own.{% endblock %}">
  <meta name="theme-color" content="#090909">
  {% if config.CANONICAL_HOST %}<link rel="canonical" href="https://{{ config.CANONICAL_HOST }}{{ request.path }}">{% endif %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css', v='ios-nav-20261021') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/blog-navigation.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/experience.css') }}">
  <script src="{{ url_for('static', filename='js/site.js', v='contact-nav-20261025') }}" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-components.css', v='20261025') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
