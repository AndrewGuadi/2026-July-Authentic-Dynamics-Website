{% extends 'admin/base.html' %}
{% block admin_content %}
<section class="admin-panel admin-auth" aria-labelledby="login-title">
  <p class="eyebrow">WELCOME BACK</p>
  <h1 id="login-title">Your next conversation starts here.</h1>
  <p>Sign in to review messages from your website.</p>
  {% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('admin.login') }}" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email address<input type="email" name="email" autocomplete="username" required maxlength="254" autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="128"></label>
    <button class="button black" type="submit">Sign in <span>↗</span></button>
  </form>
</section>
{% endblock %}
