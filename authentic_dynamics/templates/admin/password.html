{% extends 'admin/base.html' %}
{% block admin_content %}
<section class="admin-panel admin-auth" aria-labelledby="password-title">
  <h1 id="password-title">Change password.</h1><p>Use 12–128 characters. Changing your password signs out your other sessions.</p>
  {% if error %}<p class="admin-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password<input type="password" name="current_password" autocomplete="current-password" required maxlength="128"></label>
    <label>New password<input type="password" name="new_password" autocomplete="new-password" required minlength="12" maxlength="128"></label>
    <label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" required minlength="12" maxlength="128"></label>
    <button class="button black" type="submit">Update password <span>↗</span></button>
  </form>
</section>
{% endblock %}
